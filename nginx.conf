server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Gzip text assets (html is always compressed by default).
  gzip on;
  gzip_vary on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  # Hashed Vite output is immutable, cache it for a year.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # The entry point must be revalidated so new deploys are picked up.
  location = /index.html {
    add_header Cache-Control "no-cache";
  }

  # SPA fallback: client-side routes resolve to the app shell.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
